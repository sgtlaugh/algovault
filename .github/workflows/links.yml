name: Links

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 0"  # weekly: problem links rot as judges move or retire problems

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # These judges answer bots with 403 whether or not the page exists, so checking them proves nothing
      # 429 means rate limited, not dead
      - uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: >-
            --no-progress
            --max-concurrency 8
            --accept 200..=299,429
            --exclude codeforces\.com
            --exclude spoj\.com
            --exclude dmoj\.ca
            --exclude leetcode\.com
            --exclude qoj\.ac
            README.md CONTRIBUTING.md code_library/*/README.md
